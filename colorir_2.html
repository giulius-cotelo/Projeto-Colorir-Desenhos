<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorir e Divertir!</title>
<style>
  :root{
    --paper:#FFF8ED;
    --card:#FFFFFF;
    --ink:#2B2B2B;
    --red:#E63946;
    --blue:#4D96FF;
    --yellow:#FFD60A;
    --green:#52B788;
    --purple:#9B5DE5;
    --shadow-off: 6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle, rgba(43,43,43,0.06) 2px, transparent 2px);
    background-size: 26px 26px;
    font-family:-apple-system, "Segoe UI", "Trebuchet MS", Verdana, sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
  }
  svg, .zone, .crayon, .theme-card{
    -webkit-user-drag:none;
    -khtml-user-drag:none;
    -moz-user-drag:none;
    -o-user-drag:none;
    user-drag:none;
  }
  .hidden{display:none !important;}

  /* ---------- shared chunky sticker style ---------- */
  .chunky{
    border:4px solid var(--ink);
    border-radius:20px;
    box-shadow: var(--shadow-off) var(--shadow-off) 0 var(--ink);
    background:var(--card);
  }
  button{
    font-family:inherit;
    font-weight:800;
    font-size:1rem;
    cursor:pointer;
    border:4px solid var(--ink);
    border-radius:16px;
    padding:10px 18px;
    background:var(--card);
    box-shadow:5px 5px 0 var(--ink);
    transition: transform .08s ease, box-shadow .08s ease;
    color:var(--ink);
  }
  button:hover{ transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--ink); }
  button:active{ transform:translate(1px,1px); box-shadow:3px 3px 0 var(--ink); }

  /* ---------- MENU ---------- */
  #menu-screen{ max-width:1000px; margin:0 auto; padding:28px 18px 60px; }
  .menu-header{ text-align:center; margin-bottom:8px; }
  .menu-header h1{
    font-size:clamp(2rem, 5vw, 3rem);
    margin:0;
    letter-spacing:.5px;
  }
  .menu-header p{ font-size:1.05rem; margin:8px 0 28px; opacity:.75; }

  .theme-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap:22px;
  }
  .theme-card{
    position:relative;
    padding:22px 10px 16px;
    text-align:center;
    cursor:pointer;
    background:var(--card);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .theme-card:hover{ transform:translate(-3px,-3px) rotate(-1deg); box-shadow:9px 9px 0 var(--ink); }
  .theme-card .emoji{ font-size:2.6rem; display:block; margin-bottom:8px; }
  .theme-card .name{ font-weight:800; font-size:1.05rem; }
  .badge{
    position:absolute; top:-10px; right:-10px;
    background:var(--green); color:#fff; font-weight:800; font-size:.7rem;
    padding:5px 9px; border-radius:999px; border:3px solid var(--ink);
    transform:rotate(8deg);
  }

  /* ---------- GAME SCREEN ---------- */
  #game-screen{ max-width:1100px; margin:0 auto; padding:18px; }
  .game-topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin-bottom:18px;
  }
  .game-topbar h2{ margin:0; font-size:1.6rem; flex:1; text-align:center; min-width:180px;}
  .topbar-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .topbar-actions button.danger{ background:#FFE3E3; }
  .topbar-actions button.primary{ background:var(--yellow); }

  .game-body{
    display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;
    justify-content:center;
  }
  .artwork-frame{
    padding:14px;
    background:var(--card);
    width:min(560px, 92vw);
  }
  .artwork-frame svg{ width:100%; height:auto; display:block; }

  .zone{ stroke:var(--ink); stroke-width:6; stroke-linejoin:round; stroke-linecap:round; cursor:pointer; touch-action:manipulation; }
  .zone:hover{ filter:brightness(0.94); }
  .bg-zone{ stroke:none; }
  .deco{ fill:var(--ink); pointer-events:none; }

  .palette-panel{
    width:min(320px, 92vw);
    padding:18px;
  }
  .palette-panel h3{ margin:0 0 4px; font-size:1.05rem; }
  .palette-panel .hint{ font-size:.82rem; opacity:.7; margin:0 0 14px; }
  .crayons{
    display:flex; flex-wrap:wrap; gap:10px 8px; justify-content:flex-start;
  }
  .crayon{
    width:34px; height:58px;
    border:3px solid var(--ink);
    clip-path: polygon(20% 100%, 20% 22%, 50% 0%, 80% 22%, 80% 100%);
    cursor:pointer;
    position:relative;
    transition: transform .08s ease;
  }
  .crayon::after{
    content:"";
    position:absolute; left:0; right:0; top:60%; height:14px;
    background:rgba(255,255,255,.55);
    border-top:2px solid rgba(43,43,43,.5);
    border-bottom:2px solid rgba(43,43,43,.5);
  }
  .crayon:hover{ transform:translateY(-4px); }
  .crayon.selected{ transform:translateY(-6px) scale(1.08); box-shadow:0 0 0 3px var(--ink), 0 0 0 6px #fff; }

  .selected-label{ margin-top:16px; font-size:.85rem; display:flex; align-items:center; gap:8px; }
  .selected-swatch{ width:22px; height:22px; border-radius:50%; border:3px solid var(--ink); display:inline-block; }

  footer.credit{ text-align:center; font-size:.78rem; opacity:.55; margin-top:40px; }

  @media (max-width:700px){
    .game-topbar h2{ order:-1; width:100%; }
  }
</style>
</head>

        <ellipse class="zone" fill="#FFFFFF" id="gato-body" cx="235" cy="360" rx="95" ry="70"/>
        <circle class="zone" fill="#FFFFFF" id="gato-head" cx="235" cy="230" r="80"/>
        <polygon class="zone" fill="#FFFFFF" id="gato-ear-left" points="175,175 165,110 220,165"/>
        <polygon class="zone" fill="#FFFFFF" id="gato-ear-right" points="295,175 305,110 250,165"/>
        <polygon class="zone" fill="#FFFFFF" id="gato-ear-inner-left" points="185,168 180,138 205,163"/>
        <polygon class="zone" fill="#FFFFFF" id="gato-ear-inner-right" points="285,168 290,138 265,163"/>
        <circle class="zone" fill="#FFFFFF" id="gato-bow" cx="235" cy="300" r="18"/>
        <circle class="zone" fill="#FFFFFF" id="gato-yarn" cx="90" cy="440" r="35"/>
        <circle class="deco" cx="205" cy="220" r="7"/>
        <circle class="deco" cx="265" cy="220" r="7"/>
        <path class="deco" d="M235,240 l-8,10 l16,0 Z"/>
      </svg>

      <svg id="art-sorvete" class="art hidden" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" draggable="false">
        <rect class="zone bg-zone" fill="#FFFFFF" id="sorvete-bg" x="0" y="0" width="500" height="500"/>
        <line class="deco" x1="40" y1="440" x2="460" y2="440" stroke="#2b2b2b" stroke-width="6"/>
        <path class="deco" d="M250,94 Q260,70 275,65" stroke="#2b2b2b" stroke-width="4" fill="none"/>
        <circle class="zone" fill="#FFFFFF" id="sorv-cherry" cx="250" cy="110" r="16"/>
        <circle class="zone" fill="#FFFFFF" id="sorv-scoop1" cx="250" cy="160" r="55"/>
        <circle class="zone" fill="#FFFFFF" id="sorv-scoop2" cx="250" cy="230" r="60"/>
        <circle class="zone" fill="#FFFFFF" id="sorv-scoop3" cx="250" cy="300" r="65"/>
        <polygon class="zone" fill="#FFFFFF" id="sorv-cone" points="200,340 300,340 250,440"/>
        <ellipse class="zone" fill="#FFFFFF" id="sorv-strawberry" cx="110" cy="380" rx="35" ry="42"/>
        <path class="zone" fill="#FFFFFF" id="sorv-strawberry-leaf" d="M110,338 l-15,-18 l15,6 l15,-6 Z"/>
        <path class="zone" fill="#FFFFFF" id="sorv-banana" d="M370,340 C420,340 440,300 430,260 C440,310 415,355 370,360 Z"/>
      </svg>

    </div>

    <div class="palette-panel chunky">
      <h3>🖍 Cores</h3>
      <p class="hint">Toque em uma cor e depois toque no desenho para pintar!</p>
      <div class="crayons" id="crayons"></div>
      <div class="selected-label">
        <span>Cor atual:</span>
        <span class="selected-swatch" id="selected-swatch"></span>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  "use strict";

  var THEMES = [
    {id:'dino',      name:'Dinossauro',   emoji:'🦕'},
    {id:'casa',      name:'Casa',         emoji:'🏠'},
    {id:'carro',     name:'Carro',        emoji:'🚗'},
    {id:'mar',       name:'Fundo do Mar', emoji:'🐠'},
    {id:'jardim',    name:'Jardim',       emoji:'🌸'},
    {id:'espaco',    name:'Espaço',       emoji:'🚀'},
    {id:'robo',      name:'Robô',         emoji:'🤖'},
    {id:'unicornio', name:'Unicórnio',    emoji:'🦄'},
    {id:'gato',      name:'Gatinho',      emoji:'🐱'},
    {id:'sorvete',   name:'Sorvete',      emoji:'🍦'}
  ];

  var COLORS = [
    '#E63946','#F4A261','#FFD60A','#52B788','#2A9D8F',
    '#4D96FF','#3A0CA3','#9B5DE5','#F15BB5','#8D5524',
    '#2B2B2B','#ADB5BD','#F4C2A1','#A3E635','#48CAE4','#FFFFFF'
  ];

  var currentColor = COLORS[0];
  var currentTheme = null;

  var menuScreen = document.getElementById('menu-screen');
  var gameScreen = document.getElementById('game-screen');
  var themeGrid = document.getElementById('theme-grid');
  var gameTitle = document.getElementById('game-title');
  var artworkContainer = document.getElementById('artwork-container');
  var crayonsWrap = document.getElementById('crayons');
  var selectedSwatch = document.getElementById('selected-swatch');

  // ---- safe helpers: work even where SVGElement.classList or
  // Array.prototype.find are missing/partial (older or corporate browsers) ----
  function hasClass(el, cls){
    if(!el) return false;
    if(el.classList){ try{ return el.classList.contains(cls); }catch(e){} }
    var c = el.getAttribute ? (el.getAttribute('class') || '') : (el.className || '');
    return (' ' + c + ' ').indexOf(' ' + cls + ' ') !== -1;
  }
  function addClass(el, cls){
    if(!el) return;
    if(el.classList){ try{ el.classList.add(cls); return; }catch(e){} }
    var c = el.getAttribute ? (el.getAttribute('class') || '') : '';
    if((' ' + c + ' ').indexOf(' ' + cls + ' ') === -1){
      el.setAttribute('class', (c ? c + ' ' : '') + cls);
    }
  }
  function removeClass(el, cls){
    if(!el) return;
    if(el.classList){ try{ el.classList.remove(cls); return; }catch(e){} }
    var c = el.getAttribute ? (el.getAttribute('class') || '') : '';
    var next = (' ' + c + ' ').replace(' ' + cls + ' ', ' ').replace(/^\s+|\s+$/g,'');
    el.setAttribute('class', next);
  }
  function findTheme(themeId){
    for(var i=0;i<THEMES.length;i++){ if(THEMES[i].id === themeId){ return THEMES[i]; } }
    return null;
  }

  function storageKey(themeId){ return 'colorir-' + themeId; }

  function safeGet(key){
    try { return localStorage.getItem(key); } catch(e){ return null; }
  }
  function safeSet(key, val){
    try { localStorage.setItem(key, val); } catch(e){ /* ignore */ }
  }
  function safeRemove(key){
    try { localStorage.removeItem(key); } catch(e){ /* ignore */ }
  }

  function themeHasProgress(themeId){
    var raw = safeGet(storageKey(themeId));
    if(!raw) return false;
    try{
      var data = JSON.parse(raw);
      return Object.keys(data).some(function(k){
        var c = data[k];
        return c && c.toUpperCase() !== '#FFFFFF';
      });
    }catch(e){ return false; }
  }

  function buildMenu(){
    themeGrid.innerHTML = '';
    THEMES.forEach(function(t){
      var card = document.createElement('div');
      card.className = 'theme-card chunky';
      card.setAttribute('role','button');
      card.setAttribute('tabindex','0');

      var emoji = document.createElement('span');
      emoji.className = 'emoji';
      emoji.textContent = t.emoji;

      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = t.name;

      card.appendChild(emoji);
      card.appendChild(name);

      if(themeHasProgress(t.id)){
        var badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = 'colorido!';
        card.appendChild(badge);
      }

      card.addEventListener('click', function(){ openTheme(t.id); });
      card.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ openTheme(t.id); }
      });

      themeGrid.appendChild(card);
    });
  }

  function buildPalette(){
    crayonsWrap.innerHTML = '';
    COLORS.forEach(function(c, idx){
      var el = document.createElement('div');
      el.className = 'crayon' + (idx === 0 ? ' selected' : '');
      el.style.background = c;
      el.title = c;
      el.addEventListener('click', function(){
        currentColor = c;
        var all = crayonsWrap.querySelectorAll('.crayon');
        for(var i=0;i<all.length;i++){ removeClass(all[i], 'selected'); }
        addClass(el, 'selected');
        selectedSwatch.style.background = currentColor;
      });
      crayonsWrap.appendChild(el);
    });
    selectedSwatch.style.background = currentColor;
  }

  function getThemeName(id){
    for(var i=0;i<THEMES.length;i++){ if(THEMES[i].id === id) return THEMES[i].name; }
    return 'Desenho';
  }

  function getSvgEl(themeId){
    return document.getElementById('art-' + themeId);
  }

  function openTheme(themeId){
    currentTheme = themeId;
    var themeObj = findTheme(themeId);
    gameTitle.textContent = getThemeName(themeId) + ' ' + (themeObj ? themeObj.emoji : '');

    var all = artworkContainer.querySelectorAll('svg.art');
    for(var i=0;i<all.length;i++){ addClass(all[i], 'hidden'); }
    var svg = getSvgEl(themeId);
    removeClass(svg, 'hidden');

    loadState(themeId);

    addClass(menuScreen, 'hidden');
    removeClass(gameScreen, 'hidden');
    window.scrollTo(0,0);
  }

  function backToMenu(){
    if(currentTheme){ saveState(currentTheme); }
    buildMenu();
    addClass(gameScreen, 'hidden');
    removeClass(menuScreen, 'hidden');
    currentTheme = null;
    window.scrollTo(0,0);
  }

  function saveState(themeId){
    var svg = getSvgEl(themeId);
    if(!svg) return;
    var zones = svg.querySelectorAll('.zone');
    var data = {};
    zones.forEach(function(z){
      if(z.id){ data[z.id] = z.getAttribute('fill') || '#FFFFFF'; }
    });
    safeSet(storageKey(themeId), JSON.stringify(data));
  }

  function loadState(themeId){
    var svg = getSvgEl(themeId);
    if(!svg) return;
    var raw = safeGet(storageKey(themeId));
    var data = {};
    if(raw){
      try{ data = JSON.parse(raw); }catch(e){ data = {}; }
    }
    var zones = svg.querySelectorAll('.zone');
    zones.forEach(function(z){
      var val = z.id && data[z.id] ? data[z.id] : '#FFFFFF';
      z.setAttribute('fill', val);
    });
  }

  function clearCurrentTheme(){
    if(!currentTheme) return;
    if(!window.confirm('Apagar as cores deste desenho?')) return;
    var svg = getSvgEl(currentTheme);
    var zones = svg.querySelectorAll('.zone');
    zones.forEach(function(z){ z.setAttribute('fill', '#FFFFFF'); });
    safeRemove(storageKey(currentTheme));
  }

  function downloadCurrentTheme(){
    if(!currentTheme) return;
    var svg = getSvgEl(currentTheme);
    var clone = svg.cloneNode(true);
    removeClass(clone, 'hidden');
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    clone.setAttribute('width','500');
    clone.setAttribute('height','500');

    var styleEl = document.createElementNS('http://www.w3.org/2000/svg','style');
    styleEl.textContent = '.zone{stroke:#2B2B2B;stroke-width:6;stroke-linejoin:round;stroke-linecap:round;} .bg-zone{stroke:none;} .deco{fill:#2B2B2B;}';
    clone.insertBefore(styleEl, clone.firstChild);

    var defsSource = document.querySelector('defs');
    if(defsSource){
      clone.insertBefore(defsSource.cloneNode(true), clone.firstChild);
    }

    var serializer = new XMLSerializer();
    var svgString = serializer.serializeToString(clone);
    var svgBlob = new Blob([svgString], {type:'image/svg+xml;charset=utf-8'});
    var url = URL.createObjectURL(svgBlob);

    var img = new Image();
    img.onload = function(){
      var size = 1000;
      var canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0,0,size,size);
      ctx.drawImage(img, 0, 0, size, size);
      URL.revokeObjectURL(url);

      canvas.toBlob(function(blob){
        var link = document.createElement('a');
        link.download = 'meu-desenho-' + currentTheme + '.png';
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }, 'image/png');
    };
    img.src = url;
  }

  // click-to-paint delegation (both 'pointerup' and 'click' for maximum
  // cross-browser reliability — some desktop browsers can suppress a plain
  // 'click' if they detect a native image/SVG drag gesture; 'pointerup'
  // is not affected by that and fires consistently for mouse/touch/pen)
  function paintFromEvent(e){
    var target = e.target;
    if(hasClass(target, 'zone')){
      target.setAttribute('fill', currentColor);
      if(currentTheme){ saveState(currentTheme); }
    }
  }
  artworkContainer.addEventListener('pointerup', paintFromEvent);
  artworkContainer.addEventListener('click', paintFromEvent);

  document.getElementById('btn-back').addEventListener('click', backToMenu);
  document.getElementById('btn-clear').addEventListener('click', clearCurrentTheme);
  document.getElementById('btn-download').addEventListener('click', downloadCurrentTheme);

  window.addEventListener('error', function(e){
    try{
      var box = document.getElementById('js-error-box');
      if(!box){
        box = document.createElement('div');
        box.id = 'js-error-box';
        box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#ffe3e3;color:#900;' +
          'padding:10px 14px;font-family:monospace;font-size:12px;white-space:pre-wrap;z-index:9999;border-top:3px solid #900;';
        document.body.appendChild(box);
      }
      box.textContent = 'Erro no jogo: ' + (e && e.message ? e.message : e) +
        (e && e.filename ? (' (linha ' + e.lineno + ')') : '');
    }catch(ignored){}
  });

  try{
    buildMenu();
    buildPalette();
  }catch(e){
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ffe3e3;color:#900;' +
      'padding:14px;font-family:monospace;font-size:13px;white-space:pre-wrap;z-index:9999;border-bottom:3px solid #900;';
    box.textContent = 'Erro ao iniciar o jogo: ' + (e && e.message ? e.message : e);
    document.body.insertBefore(box, document.body.firstChild);
  }
})();
</script>

</body>
</html>
